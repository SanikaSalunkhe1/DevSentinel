version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devsentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devsentinel
      POSTGRES_PASSWORD: devsentinel_pass
      POSTGRES_DB: devsentinel_db
    ports:
      - "5432:5432"
    volumes:
      - devsentinel_pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

volumes:
  devsentinel_pgdata:
    driver: local
