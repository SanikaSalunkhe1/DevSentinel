services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devsentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devsentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devsentinel_pass}
      POSTGRES_DB: ${POSTGRES_DB:-devsentinel_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - devsentinel_pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devsentinel} -d ${POSTGRES_DB:-devsentinel_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  devsentinel_pgdata:
    name: devsentinel_pgdata
